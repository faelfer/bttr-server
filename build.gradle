plugins {
    id 'java'
    id 'io.quarkus'
    id 'com.diffplug.spotless' version '8.10.2'
    id 'checkstyle'
}

group = 'br.com.bttr'
version = '1.0.0-SNAPSHOT'

repositories { mavenCentral() }

dependencies {
    implementation enforcedPlatform("io.quarkus.platform:quarkus-bom:${quarkusPlatformVersion}")
    implementation 'io.quarkus:quarkus-rest-jackson'
    implementation 'io.quarkus:quarkus-hibernate-orm-panache'
    implementation 'io.quarkus:quarkus-jdbc-postgresql'
    implementation 'io.quarkus:quarkus-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'io.quarkus:quarkus-hibernate-validator'
    implementation 'io.quarkus:quarkus-smallrye-openapi'
    implementation 'io.quarkus:quarkus-smallrye-health'
    implementation 'io.quarkus:quarkus-oidc'

    testImplementation 'io.quarkus:quarkus-junit5'
    testImplementation 'io.quarkus:quarkus-junit5-mockito'
    testImplementation 'io.quarkus:quarkus-test-security'
    testImplementation 'io.quarkus:quarkus-test-security-oidc'
    testImplementation 'io.rest-assured:rest-assured'
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

spotless {
    java {
        target 'src/main/java/**/*.java',
                'src/test/java/**/*.java',
                'src/integrationTest/java/**/*.java'
        googleJavaFormat('1.36.1')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

checkstyle {
    toolVersion = '14.1.0'
    sourceSets = [
        project.sourceSets.main,
        project.sourceSets.test,
        project.sourceSets.integrationTest
    ]
    configFile = file('config/checkstyle/checkstyle.xml')
    maxWarnings = 0
    ignoreFailures = false
}

tasks.named('checkstyleMain') {
    source = fileTree('src/main/java') { include '**/*.java' }
}

tasks.named('checkstyleTest') {
    source = fileTree('src/test/java') { include '**/*.java' }
}

tasks.named('checkstyleIntegrationTest') {
    source = fileTree('src/integrationTest/java') { include '**/*.java' }
}

tasks.withType(Checkstyle).configureEach {
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

test {
    useJUnitPlatform()
    systemProperty 'java.util.logging.manager', 'org.jboss.logmanager.LogManager'
    // PostgreSQL Dev Services creates an isolated database; never use the development DB.
    environment.remove('DATABASE_URL')
    environment.remove('DATABASE_USERNAME')
    environment.remove('DATABASE_PASSWORD')
    maxHeapSize = '1g'
}
