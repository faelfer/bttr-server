name: bttr-ci

services:
  tests:
    image: eclipse-temurin:21-jdk
    working_dir: /workspace
    user: "${CI_UID:-1000}:${CI_GID:-1000}"
    environment:
      GRADLE_USER_HOME: /workspace/.gradle/ci
      _TEST_QUARKUS_DATASOURCE_DEVSERVICES_ENABLED: "false"
      _TEST_QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres-test:5432/bttr_test
      _TEST_QUARKUS_DATASOURCE_USERNAME: bttr_test
      _TEST_QUARKUS_DATASOURCE_PASSWORD: bttr_test
      DATABASE_URL: jdbc:postgresql://postgres-test:5432/bttr_test
      DATABASE_USERNAME: bttr_test
      DATABASE_PASSWORD: bttr_test
      KEYCLOAK_URL: http://localhost:1
      KEYCLOAK_CLIENT_SECRET: integration-test-secret
      QUARKUS_OIDC_DISCOVERY_ENABLED: "false"
      QUARKUS_OIDC_JWKS_PATH: /certs
      QUARKUS_OIDC_JWKS_RESOLVE_EARLY: "false"
      SONAR_HOST_URL: "${SONAR_HOST_URL:-}"
      SONAR_TOKEN: "${SONAR_AUTH_TOKEN:-}"
    volumes:
      - ${CI_WORKSPACE:-.}:/workspace:z
    command: ["./gradlew", "clean", "build", "quarkusIntTest", "--no-daemon", "--console=plain"]
    depends_on:
      postgres-test:
        condition: service_healthy

  postgres-test:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: bttr_test
      POSTGRES_USER: bttr_test
      POSTGRES_PASSWORD: bttr_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bttr_test -d bttr_test"]
      interval: 2s
      timeout: 5s
      retries: 30
