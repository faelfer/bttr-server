quarkus.application.name=bttr-server
quarkus.http.port=${HTTP_PORT:8000}
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type
quarkus.http.limits.max-body-size=64K
quarkus.http.auth.proactive=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DATABASE_USERNAME:bttr}
quarkus.datasource.password=${DATABASE_PASSWORD:bttr_local}
%dev.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/bttr}
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true

bttr.keycloak.url=${KEYCLOAK_URL:http://localhost:8180}
bttr.keycloak.realm=${KEYCLOAK_REALM:bttr}
bttr.keycloak.client-id=${KEYCLOAK_CLIENT_ID:bttr-server}
bttr.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}
%dev.bttr.keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:bttr-local-secret}
quarkus.oidc.auth-server-url=${bttr.keycloak.url}/realms/${bttr.keycloak.realm}
quarkus.oidc.client-id=${bttr.keycloak.client-id}
quarkus.oidc.application-type=service
quarkus.oidc.token.authorization-scheme=Token
quarkus.oidc.token.audience=${bttr.keycloak.client-id}
quarkus.oidc.token.allow-jwt-introspection=false
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.keycloak.devservices.enabled=false

quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.info-title=Bttr API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API compatível com bttr-client-react. Faça login e informe Token <token> no botão Authorize.
quarkus.smallrye-openapi.store-schema-directory=build/generated/openapi
quarkus.smallrye-openapi.security-scheme=api-key
quarkus.smallrye-openapi.security-scheme-name=tokenAuth
quarkus.smallrye-openapi.api-key-parameter-in=header
quarkus.smallrye-openapi.api-key-parameter-name=Authorization

%test.quarkus.http.port=0
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.datasource.devservices.reuse=false
%test.quarkus.datasource.devservices.image-name=postgres:17.6-alpine
%test.quarkus.oidc.auth-server-url=http://localhost:1/realms/test
%test.quarkus.oidc.discovery-enabled=false
%test.quarkus.oidc.jwks-path=/certs
%test.quarkus.oidc.jwks.resolve-early=false
%test.bttr.keycloak.client-secret=test-secret
